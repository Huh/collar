# spdgt-guard-version: 4
repos:
  - repo: https://github.com/lorenzwalthert/precommit
    rev: v0.4.3.9001
    hooks:
      - id: parsable-R
      - id: no-browser-statement
      - id: deps-in-desc
  - repo: local
    hooks:
      # Documents from the REPO'S library, like the lint hook beside it. Upstream's
      # `roxygenize` is `language: r`, so pkgload::load_all() inside it cannot find the
      # package's dependencies and it errors before reading a single roxygen comment —
      # "The packages dplyr, sf, spdgt.auth ... are required" in spdgt.core. Its own
      # answer is to restate every Import under additional_dependencies, a second copy
      # of DESCRIPTION that drifts from the first. See roxygenize-project.sh.
      - id: roxygenize-project
        name: Document with roxygen2 (project library)
        entry: ../spdgt-build-templates/roxygenize-project.sh
        language: system
        files: '^(R|man)/'
        pass_filenames: false
      # lintr runs from the REPO'S library, not an isolated one, so object_usage_linter
      # can resolve the packages the code attaches. The upstream `lintr` hook is
      # `language: r`, and pre-commit points R_PROFILE_USER at its own env, so renv's
      # activate.R never runs and every attached package's functions read as undefined
      # globals. See the header of lintr-project.sh for the two lines that do it and the
      # measurements. Shared from the templates repo like the secret scan, so a change
      # here reaches every repo on a pull rather than a commit each.
      - id: lintr-project
        name: Lint R (project library, so object_usage works)
        entry: ../spdgt-build-templates/lintr-project.sh
        language: system
        files: '\.([rR]|[rR]md|[qQ]md|[rR]profile)$'
        exclude: '(^|/)renv/'
      # Wraps gitleaks so findings warn until a cutoff date and block after it —
      # see the header of gitleaks-staged.sh for why. Uses the gitleaks on PATH
      # (brew install gitleaks); the upstream `gitleaks` hook id builds from source,
      # needs a Go toolchain, and cannot express the grace period.
      #
      # verbose: true matters. pre-commit hides output from passing hooks, and during
      # the warning window this hook passes — without it the warning is never seen.
      - id: gitleaks-staged
        name: Detect hardcoded secrets (warns until cutoff, then blocks)
        entry: ../spdgt-build-templates/gitleaks-staged.sh
        language: system
        pass_filenames: false
        verbose: true
